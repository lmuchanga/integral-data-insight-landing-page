version: '3.8'

services:
  integral-data-landing:
    image: nginx:alpine
    container_name: integral-data-landing
    volumes:
      - /home/projects/integral-data-insight-landing-page/dist:/usr/share/nginx/html:ro
      - /home/projects/integral-data-insight-landing-page/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    restart: unless-stopped